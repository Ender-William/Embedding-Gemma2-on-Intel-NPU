[project]
name = "embeddinggemma2-local"
version = "0.1.0"
description = "Local multi-modal EmbeddingGemma 2 inference with ONNX Runtime and OpenVINO"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4,<3",
    "pillow>=12.0",
    "transformers>=5.18",
    "tqdm>=4.70",
    "torch>=2.14",
    "torchvision>=0.29",
    "sentence-transformers>=6.1",
    "onnx>=1.23",
    "onnxscript>=0.7",
    "nncf>=3.4",
    "onnxruntime-gpu==1.31.0",
    "onnxconverter-common>=1.14",
    "openvino>=2026.4",
    "ml-dtypes>=0.6",
    "librosa>=1.0",
    "av>=19.0",
]

[tool.uv]
torch-backend = "cu130"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
